<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote of the Day</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .quote-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
        }

        h1 {
            color: #333;
        }

        .quote {
            font-size: 1.4rem;
            font-style: italic;
            color: #555;
            margin: 20px 0;
        }

        .author {
            font-weight: bold;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="quote-box">
        <h1>Quote of the Day</h1>
        <p class="quote">
            "Success is not final, failure is not fatal: it is the courage to continue that counts."
        </p>
        <p class="author">- Winston Churchill</p>
    </div>
</body>
</html>
